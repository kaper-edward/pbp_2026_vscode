plugins {
    id 'application'
}

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(26)
    }
}

application {
    mainClass = 'DateTimePractice'
}

dependencies {
    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('run', JavaExec) {
    standardInput = System.in
    systemProperty 'user.language', 'en'
    systemProperty 'user.country', 'US'
}

tasks.named('test', Test) {
    useJUnitPlatform()
    failOnNoDiscoveredTests = true
    systemProperty 'practice.mainClass', application.mainClass.get()
    systemProperty 'practice.classpath', sourceSets.main.output.classesDirs.asPath
    systemProperty 'user.language', 'en'
    systemProperty 'user.country', 'US'
}
gradle.taskGraph.whenReady { graph ->
    if (graph.hasTask(tasks.named('test').get()) && sourceSets.test.allJava.empty) {
        throw new GradleException('Public test sources are missing. This is not a test pass.')
    }
}
